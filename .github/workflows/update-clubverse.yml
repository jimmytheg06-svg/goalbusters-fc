name: Update ClubVerse schedule data

on:
  schedule:
    # Sundays at 1:00 PM CDT (UTC-5), covering both leagues (scripts/
    # update-clubverse.mjs scrapes each in turn). Neither league's actual
    # match day/time has been confirmed against this cron — adjust once
    # known. If this workflow needs to keep running after Daylight Time
    # ends (~Nov 1), switch to '0 19 * * 0' for CST (UTC-6).
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      debug_images:
        description: "Log <img> elements found on the ClubVerse page (diagnostic only, no site changes)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-clubverse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run ClubVerse update
        run: node scripts/update-clubverse.mjs
        env:
          DEBUG_IMAGES: ${{ github.event.inputs.debug_images }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "goalbuster-clubverse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update league schedule/results from ClubVerse [skip ci]"
          git push

      - name: Open an issue if this run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `ClubVerse auto-update failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The scheduled ClubVerse update workflow failed and did not update the site.\n\nRun log: ${runUrl}\n\nThe league schedule/results/standings currently live on the site (both the 40+ and 35+ divisions) are unchanged from before this run — nothing broke on the live site, this just means it's stale until the next successful run (or a manual re-run via Actions → "Update ClubVerse schedule data" → "Run workflow").`,
            });
